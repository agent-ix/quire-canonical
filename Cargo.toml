[package]
name = "quire-canonical"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
description = "Streaming RFC 8785 (JCS) canonical JSON writer that hashes as it encodes."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-canonical"
publish = false

[workspace]
members = [".", "quire-canonical-derive"]
# Plain `cargo` commands (the Makefile's lint, test and build lanes) cover
# the derive crate as well as the library.
default-members = [".", "quire-canonical-derive"]

[lib]
name = "quire_canonical"
path = "src/lib.rs"

[features]
default = ["std"]
# The `io::Write` adapter (`WriteSink`) and the `Error::Sink` variant that
# carries an `io::Error`. Without it the crate is `no_std` + `alloc`: encoding
# into a `Vec<u8>` or a SHA-256 hasher, and digest minting, still work.
std = ["serde/std", "sha2/std"]
# `impl Encode for serde_json::Value` and `drop_value`. serde_json is built
# with `alloc` rather than `std`, so this works with or without `std`, and
# with `float_roundtrip`, so a float literal parses to its nearest double, as
# `read` parses it. Without it serde_json rounds some literals twice, and the
# same JSON text would give different bytes through a `Value` than through
# `read`.
serde_json = ["dep:serde_json"]
# Test lane only: turns on `serde_json/preserve_order` so the golden vectors
# run against an insertion-ordered `serde_json::Map` as well as the default
# `BTreeMap` one. `make test` runs the suite both ways. It also turns on the
# `serde_json` feature, so the `serde_json::Value` tests run where a map
# iterates in insertion order and the encoder alone puts members in canonical
# order. The encoder never reads this feature; its output does not depend on
# it.
test-preserve-order = ["serde_json", "serde_json/preserve_order"]

[dependencies]
quire-canonical-derive = { path = "quire-canonical-derive" }
ryu-js = "1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
serde_json = { version = "1", optional = true, default-features = false, features = [
    "alloc",
    "float_roundtrip",
] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: the vector file's float literals must parse to the exact
# nearest double, or a vector would test the parser rather than the encoder.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
